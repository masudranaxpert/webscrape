services:
  anti:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "8000"
    env_file:
      - .env
    shm_size: "512mb"
    volumes:
      - anti-data:/app/data
      # CloakBrowser builds (keyless + Pro, ~700 MB each) and the GeoIP DB. A new volume is seeded from the image's
      # baked keyless build; the Pro build is downloaded once and then kept across deploys. app/core/binaries.py
      # updates and prunes them in the background.
      - cloak-cache:/home/ubuntu/.cloakbrowser
    # Docker never restarts an unhealthy container by itself. After 4 failed checks in a row (2 min) the check stops
    # uvicorn gracefully (the cookie cache is saved on shutdown); tini then exits and `restart` brings it back.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if curl -fsS --max-time 10 http://127.0.0.1:8000/health >/dev/null; then rm -f /tmp/hc_fail; exit 0; fi;
          n=$$(( $$(cat /tmp/hc_fail 2>/dev/null || echo 0) + 1 )); echo $$n > /tmp/hc_fail;
          if [ $$n -ge 4 ]; then rm -f /tmp/hc_fail; pkill -TERM -f 'uvicorn [m]ain:app'; fi; exit 1
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      warp:
        condition: service_started
    networks:
      - warpnet

  warp:
    image: dublok/cloudflare-warp:latest
    restart: unless-stopped
    environment:
      WARP_INSTANCES: "1"
      WARP_CONNECT_TIMEOUT: "30"
      # gost defaults to 10 concurrent connections and 10 req/s: one Chromium page load exhausts that, after which
      # the :8080 proxy stops answering CONNECT (every default-egress request times out) while the WARP tunnel itself
      # stays healthy. A browser keeps up to 32 sockets per proxy, so leave generous headroom.
      PROXY_MAX_CONN: "1024"
      PROXY_MAX_RPS: "1000"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    # Self-healing: the :8080 gost proxy can wedge (stops answering CONNECT) while the WARP tunnel stays up. After 6
    # failed checks in a row (90 s) the check kills that gost; it is the entrypoint's foreground process, so the
    # container exits and `restart` brings up a fresh one. Before gost starts, pkill matches nothing.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if curl -fsS --max-time 5 -x http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace | grep -qE 'warp=(on|plus)';
          then rm -f /tmp/hc_fail; exit 0; fi;
          n=$$(( $$(cat /tmp/hc_fail 2>/dev/null || echo 0) + 1 )); echo $$n > /tmp/hc_fail;
          if [ $$n -ge 6 ]; then rm -f /tmp/hc_fail; pkill -f 'http://[:]8080'; fi; exit 1
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - warpnet

networks:
  warpnet:

volumes:
  warp-data:
  anti-data:
  cloak-cache:
