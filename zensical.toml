# Docs site (Zensical). Build: `zensical build --clean` -> site/. Published by .github/workflows/docs.yml.
[project]
site_name = "Anti API"
site_description = "Cloudflare-aware scraping API: architecture, configuration and operations"
site_url = "https://masudranaxpert.github.io/webscrape/"
repo_url = "https://github.com/masudranaxpert/webscrape"
repo_name = "masudranaxpert/webscrape"
docs_dir = "docs"
nav = [
  { "Overview" = "index.md" },
  { "Architecture" = [
    { "How it works" = "architecture.md" },
    { "Egress & WARP" = "egress.md" },
    { "Browsers & license" = "browsers.md" },
    { "Caching & queues" = "caching-and-queues.md" },
    { "Design decisions" = "decisions.md" },
  ] },
  { "API" = [
    { "POST /fetch" = "api/fetch.md" },
    { "POST /solve-turnstile" = "api/turnstile.md" },
    { "Cookies, health, web" = "api/other.md" },
  ] },
  { "Configuration" = "configuration.md" },
  { "Operations" = [
    { "Deploy" = "operations/deploy.md" },
    { "Cold start & self-healing" = "operations/cold-start.md" },
    { "Capacity benchmark" = "operations/benchmark.md" },
    { "Troubleshooting" = "operations/troubleshooting.md" },
  ] },
  { "Security" = "security.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
