    rel="stylesheet">
  <link rel="stylesheet" href="/static/index.css?v=4.2">
  <script>
    function toggleEndpointCard(bodyId, headerEl) {
      var body = document.getElementById(bodyId);
      var btn = headerEl.querySelector('.btn-endpoint-toggle');
      var label = headerEl.querySelector('.endpoint-toggle-label');
      if (!body) return;
      var isCollapsed = body.classList.toggle('is-collapsed');
      if (btn) btn.classList.toggle('is-collapsed', isCollapsed);
      if (label) label.textContent = isCollapsed ? 'Show' : 'Hide';
    }
  </script>
</head>
