    <!-- Domain Cache Explorer Section -->
    <section class="section-box" id="cache" style="margin-top:48px;">
      <div class="section-header">
        <div class="section-title-wrap">
          <h2 class="section-title">
            <svg class="svg-icon" style="color:var(--accent-cyan)" viewBox="0 0 24 24">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
            Domain Cache Explorer
          </h2>
        </div>
        <div class="cache-header-actions">
          <div class="cache-search-wrap">
            <svg class="svg-icon input-icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="cacheSearchInput" class="cache-search-input" placeholder="Filter domains..." />
          </div>
          <button type="button" class="btn-refresh-cache" id="btnRefreshCache" title="Refresh Live Cache">
            <svg class="svg-icon" id="refreshCacheIcon" viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10" />
              <polyline points="1 20 1 14 7 14" />
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
            </svg>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- Cache Metrics Summary Cards -->
      <div class="cache-stats-grid">
        <div class="cache-stat-card">
          <div class="cache-stat-header">
            <span class="cache-stat-label">Cached Domains</span>
          </div>
          <div class="cache-stat-val" id="statCachedDomains">0</div>
        </div>

        <div class="cache-stat-card">
          <div class="cache-stat-header">
            <span class="cache-stat-label">Browser Pool Tabs</span>
          </div>
          <div class="cache-stat-val" id="statActiveTabs">0 / 0</div>
        </div>

        <div class="cache-stat-card">
          <div class="cache-stat-header">
            <span class="cache-stat-label">Total In-Memory Cookies</span>
          </div>
          <div class="cache-stat-val" id="statTotalCookies">0</div>
        </div>

        <div class="cache-stat-card">
          <div class="cache-stat-header">
            <span class="cache-stat-label">Fast-Path Efficiency</span>
          </div>
          <div class="cache-stat-val" style="color:var(--accent-green);" id="statFastPathStatus">Ready</div>
        </div>
      </div>

      <!-- Dynamic Cache Grid -->
      <div id="cacheGrid" class="cache-cards-grid">
        <!-- Rendered by JavaScript -->
        <div class="cache-loading-msg" id="cacheLoadingMsg">
          <div class="cache-empty-icon">
            <svg class="svg-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          </div>
          <p>Loading active domain cache entries...</p>
        </div>
      </div>
    </section>
